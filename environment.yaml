name: pb
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.13.*
  - pip
  - pytorch
  - pytorch-cuda
  - pip:
    - autocorrect
    - accelerate
    - datasets
    - nltk
    - openai
    - sentencepiece
    - tokenizers
    - tqdm
    - transformers
    - google-generativeai
    - langchain
    - langchain-core
    - langchain-openai
    - pandas
    - wandb
    - anthropic
    - huggingface_hub
    - "fschat[model_worker,webui]"
    - sentence-transformers
    - fairscale
    - bitsandbytes
    - peft
    - vllm